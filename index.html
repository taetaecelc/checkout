<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="card">
        <div>
            <h1>CheckOut de Compra</h1>
        </div>
        <div id="card2">
            <label for="">Preço do Produto(R$)</label>
            <input type="text" placeholder="EX:100,00" id="preco">
            <label for="">Valor do Frete(R$)</label>
            <input type="text" placeholder="EX:15,00" id="frete">
        </div>
        <h3>Forma de Pagamento:</h3>
        <div id="botao">

            <input type="submit" value="PIX (-10%)" id="pix">
            <input type="submit" value="DINHEIRO (-5%)" id="dinheiro">
            <input type="submit" value="CARTAO À VISTA" id="cartao">
            <input type="submit" value="PARCELADO (+10%)" id="parcelado">
        </div>
        <div>
            <p id="forma">Forma:</p>
            <p id="resultado">Total:R$ 0,00</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
